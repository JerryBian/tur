name: Build and Publish

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test test/ --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test/TestResults/*.trx
          retention-days: 30

  build_nuget:
    name: Build NuGet Package
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read major version
        id: read_version
        run: |
          MAJOR_VERSION=$(cat VERSION | tr -d '[:space:]')
          FULL_VERSION="${MAJOR_VERSION}.${{ github.run_number }}.0"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "Major version: $MAJOR_VERSION"
          echo "Full version: $FULL_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build package
        run: |
          mkdir -p ./nupkg
          echo "Building NuGet package version ${{ env.FULL_VERSION }}"
          dotnet pack src/Tur.csproj \
            -c Release \
            --no-restore \
            --include-source \
            --include-symbols \
            --output ./nupkg \
            -p:Version=${{ env.FULL_VERSION }} \
            -p:PackageVersion=${{ env.FULL_VERSION }} \
            -p:RepositoryUrl=https://github.com/${{ github.repository }} \
            -p:RepositoryCommit=${{ github.sha }}
          echo "Package contents:"
          ls -lah ./nupkg

      - name: Verify package
        run: |
          PKG_PATH="./nupkg/tur.${{ env.FULL_VERSION }}.nupkg"
          if [ -f "$PKG_PATH" ]; then
            echo "Package verified: $PKG_PATH"
            echo "Package size: $(du -h "$PKG_PATH" | cut -f1)"
          else
            echo "Package not found: $PKG_PATH"
            echo "Contents of ./nupkg:"
            ls -lah ./nupkg
            exit 1
          fi

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ env.FULL_VERSION }}
          path: ./nupkg/*.nupkg
          retention-days: 90

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          PKG_PATH="./nupkg/tur.${{ env.FULL_VERSION }}.nupkg"
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NuGet API Key not found in secrets"
            exit 1
          fi
          echo "Publishing package: $PKG_PATH"
          dotnet nuget push "$PKG_PATH" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate \
            --no-symbols
          echo "Package published successfully to NuGet.org"

  publish_binaries:
    name: Publish Release Binaries
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read major version
        id: read_version
        run: |
          MAJOR_VERSION=$(cat VERSION | tr -d '[:space:]')
          FULL_VERSION="${MAJOR_VERSION}.${{ github.run_number }}.0"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "Major version: $MAJOR_VERSION"
          echo "Full version: $FULL_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip tar

      - name: Publish Binaries
        run: |
          mkdir -p __ga
          
          echo "Publishing linux-x64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r linux-x64 \
            -c Release \
            -o __ga/linux-x64
          
          echo "Publishing linux-musl-x64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r linux-musl-x64 \
            -c Release \
            -o __ga/linux-musl-x64
          
          echo "Publishing linux-arm..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r linux-arm \
            -c Release \
            -o __ga/linux-arm
          
          echo "Publishing linux-arm64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r linux-arm64 \
            -c Release \
            -o __ga/linux-arm64
          
          echo "Publishing win-x64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r win-x64 \
            -c Release \
            -o __ga/win-x64
          
          echo "Publishing win-x86..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r win-x86 \
            -c Release \
            -o __ga/win-x86
          
          echo "Publishing win-arm64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r win-arm64 \
            -c Release \
            -o __ga/win-arm64
          
          echo "Publishing osx-x64..."
          dotnet publish ./src/Tur.csproj \
            -f net8.0 \
            /p:AssemblyVersion=${{ env.FULL_VERSION }} \
            /p:DebugType=None \
            --self-contained true \
            -v normal \
            -p:PublishTrimmed=true \
            -p:PublishSingleFile=true \
            -r osx-x64 \
            -c Release \
            -o __ga/osx-x64
          
          echo "All binaries published successfully"

      - name: Package Binaries
        run: |
          cd __ga
          
          echo "Packaging linux-x64..."
          tar -czf tur-linux-x64.tar.gz --directory=linux-x64 .
          
          echo "Packaging linux-musl-x64..."
          tar -czf tur-linux-musl-x64.tar.gz --directory=linux-musl-x64 .
          
          echo "Packaging linux-arm..."
          tar -czf tur-linux-arm.tar.gz --directory=linux-arm .
          
          echo "Packaging linux-arm64..."
          tar -czf tur-linux-arm64.tar.gz --directory=linux-arm64 .
          
          echo "Packaging win-x64..."
          cd win-x64 && zip -r ../tur-win-x64.zip * && cd ..
          
          echo "Packaging win-x86..."
          cd win-x86 && zip -r ../tur-win-x86.zip * && cd ..
          
          echo "Packaging win-arm64..."
          cd win-arm64 && zip -r ../tur-win-arm64.zip * && cd ..
          
          echo "Packaging osx-x64..."
          cd osx-x64 && zip -r ../tur-osx-x64.zip * && cd ..
          
          echo "All packages created:"
          ls -lah *.tar.gz *.zip

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ env.FULL_VERSION }}
          path: |
            __ga/*.tar.gz
            __ga/*.zip
          retention-days: 90

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_nuget, publish_binaries]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read major version
        id: read_version
        run: |
          MAJOR_VERSION=$(cat VERSION | tr -d '[:space:]')
          FULL_VERSION="${MAJOR_VERSION}.${{ github.run_number }}.0"
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          # Calculate changelog link (e.g., 5.100.0 -> 51000)
          echo "CHANGELOG_LINK=${MAJOR_VERSION}${{ github.run_number }}0" >> $GITHUB_ENV
          echo "Major version: $MAJOR_VERSION"
          echo "Full version: $FULL_VERSION"

      - name: Prepare release body
        id: prepare_body
        run: |
          set -e
          VERSION="v${{ env.FULL_VERSION }}"
          
          # Get commits since last tag
          prev_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            COMMITS=$(git log ${prev_tag}..HEAD --pretty=format:'- %h %s (%an) [%ad]' --date=format:'%Y-%m-%d %H:%M:%S')
          else
            COMMITS=$(git log -n 50 --pretty=format:'- %h %s (%an) [%ad]' --date=format:'%Y-%m-%d %H:%M:%S')
          fi
          
          cat << EOF > release_notes.md
          Release $VERSION for Tur - Command line tool to manage files.
          
          ## What's Changed
          
          $COMMITS
          
          ---
          
          ## Installation
          
          ### NuGet Package (Recommended)
          
          \`\`\`bash
          dotnet tool install -g tur --version ${{ env.FULL_VERSION }}
          \`\`\`
          
          Or update existing installation:
          
          \`\`\`bash
          dotnet tool update -g tur --version ${{ env.FULL_VERSION }}
          \`\`\`
          
          ### Standalone Binaries
          
          Download the appropriate binary for your platform:
          
          - **Linux x64**: \`tur-linux-x64.tar.gz\`
          - **Linux musl x64**: \`tur-linux-musl-x64.tar.gz\`
          - **Linux ARM**: \`tur-linux-arm.tar.gz\`
          - **Linux ARM64**: \`tur-linux-arm64.tar.gz\`
          - **Windows x64**: \`tur-win-x64.zip\`
          - **Windows x86**: \`tur-win-x86.zip\`
          - **Windows ARM64**: \`tur-win-arm64.zip\`
          - **macOS x64**: \`tur-osx-x64.zip\`
          
          ---
          
          ## Usage
          
          Tur supports three main commands:
          
          - \`tur dff\` - Duplicate files finder
          - \`tur sync\` - Synchronize files between directories
          - \`tur rm\` - Remove files or directories
          
          For detailed usage: \`tur --help\` or \`tur [command] --help\`
          
          ---
          
          ## Links
          
          - **Changelog**: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md#${{ env.CHANGELOG_LINK }})
          - **NuGet Package**: [nuget.org/packages/tur/${{ env.FULL_VERSION }}](https://www.nuget.org/packages/tur/${{ env.FULL_VERSION }})
          - **Documentation**: [README.md](https://github.com/${{ github.repository }}/blob/master/README.md)
          - **GitHub Repository**: [github.com/${{ github.repository }}](https://github.com/${{ github.repository }})
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${prev_tag}...v${{ env.FULL_VERSION }}
          EOF
          
          echo "Release notes prepared"
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -exec ls -lh {} \;

      - name: Create Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: v${{ env.FULL_VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/binaries-${{ env.FULL_VERSION }}/*.tar.gz
            artifacts/binaries-${{ env.FULL_VERSION }}/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push origin latest --force